<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>ECOTITS</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body{
    font-family: Arial;
    background:#10b981;
    color:white;
    text-align:center;
}
header{ padding:30px; }
.map{ position:relative; max-width:800px; margin:auto; }
.map img{ width:100%; }
.animal{ position:absolute; font-size:30px; cursor:pointer; }
.panda{top:45%;left:75%;} .tigre{top:50%;left:68%;} .elefante{top:60%;left:55%;}
.gorila{top:55%;left:50%;} .lince{top:38%;left:45%;}
.card{ display:none; background:white; color:black; padding:20px; margin:30px auto; max-width:600px; border-radius:10px;}
.card img{ width:100%; border-radius:10px; }
button{ padding:10px 20px; margin-top:10px; cursor:pointer; }
input{ padding:10px; margin:5px; width:200px; }
</style>
</head>

<body>

<header>
<h1>🌿 ECOTITS</h1>
<p>Protege la vida silvestre</p>
</header>

<!-- LOGIN / SIGNUP -->
<div id="authForm">
  <input id="email" placeholder="Email">
  <input id="password" placeholder="Password" type="password">
  <button onclick="signup()">Registrarse</button>
  <button onclick="login()">Entrar</button>
  <p id="welcome"></p>
</div>

<!-- MAPA -->
<div class="map">
<img src="https://upload.wikimedia.org/wikipedia/commons/8/80/World_map_-_low_resolution.svg">
<span class="animal panda" onclick="show('panda')">🐼</span>
<span class="animal tigre" onclick="show('tigre')">🐯</span>
<span class="animal elefante" onclick="show('elefante')">🐘</span>
<span class="animal gorila" onclick="show('gorila')">🦍</span>
<span class="animal lince" onclick="show('lince')">🐱</span>
</div>

<!-- CARDS ANIMALES -->
<div id="panda" class="card">
<h2>Panda Gigante</h2>
<img src="https://upload.wikimedia.org/wikipedia/commons/0/0f/Grosser_Panda.JPG">
<p>Firmas: <span id="pandaCount">0</span></p>
<button onclick="sign('panda')">Firmar petición</button>
</div>

<div id="tigre" class="card">
<h2>Tigre</h2>
<img src="https://upload.wikimedia.org/wikipedia/commons/5/56/Tiger.50.jpg">
<p>Firmas: <span id="tigreCount">0</span></p>
<button onclick="sign('tigre')">Firmar petición</button>
</div>

<div id="elefante" class="card">
<h2>Elefante</h2>
<img src="https://upload.wikimedia.org/wikipedia/commons/6/6e/Elephant_near_ndutu.jpg">
<p>Firmas: <span id="elefanteCount">0</span></p>
<button onclick="sign('elefante')">Firmar petición</button>
</div>

<div id="gorila" class="card">
<h2>Gorila</h2>
<img src="https://upload.wikimedia.org/wikipedia/commons/7/73/Silverback_Gorilla.jpg">
<p>Firmas: <span id="gorilaCount">0</span></p>
<button onclick="sign('gorila')">Firmar petición</button>
</div>

<div id="lince" class="card">
<h2>Lince</h2>
<img src="https://upload.wikimedia.org/wikipedia/commons/1/1d/Iberian_lynx2.jpg">
<p>Firmas: <span id="linceCount">0</span></p>
<button onclick="sign('lince')">Firmar petición</button>
</div>

<script>
// 🔥 CONFIG FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyAGOWJMlWWwqWW_M0AwYilhBIuBE5olWDg",
  authDomain: "pro1-7115e.firebaseapp.com",
  projectId: "pro1-7115e",
  storageBucket: "pro1-7115e.firebasestorage.app",
  messagingSenderId: "354009326153",
  appId: "1:354009326153:web:3e7f4cae419b9cc1711598"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let animals = ["panda","tigre","elefante","gorila","lince"];

// LOGIN / SIGNUP
async function signup(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  try{
    const userCredential = await auth.createUserWithEmailAndPassword(email,password);
    alert("Usuario registrado: "+userCredential.user.email);
  }catch(e){ alert("Error signup: "+e.message); }
}

async function login(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  try{
    const userCredential = await auth.signInWithEmailAndPassword(email,password);
    document.getElementById("welcome").innerText="Bienvenido "+userCredential.user.email;
  }catch(e){ alert("Error login: "+e.message); }
}

// MOSTRAR ANIMAL
function show(id){
  animals.forEach(a=>document.getElementById(a).style.display="none");
  document.getElementById(id).style.display="block";
}

// FIRMAR PETICIÓN
async function sign(animal){
  const user = auth.currentUser;
  if(!user){ alert("Primero inicia sesión"); return; }

  // evitar firma duplicada
  const existing = await db.collection("firmas")
    .where("animal_id","==",animal)
    .where("email","==",user.email)
    .get();
  if(!existing.empty){ alert("Ya firmaste por este animal"); return; }

  await db.collection("firmas").add({
    _id: Date.now().toString(),
    animal_id: animal,
    nombre: user.email,
    email: user.email,
    fecha: new Date().toISOString().split("T")[0]
  });

  // actualizar contador
  const snapshot = await db.collection("firmas").where("animal_id","==",animal).get();
  document.getElementById(animal+"Count").innerText = snapshot.size;
}

// CARGAR CONTADORES AL INICIAR
window.onload = async () => {
  for(let animal of animals){
    const snapshot = await db.collection("firmas").where("animal_id","==",animal).get();
    document.getElementById(animal+"Count").innerText = snapshot.size;
  }
}
</script>

</body>
</html>
