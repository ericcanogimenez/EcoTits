<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Items</title>

    <link rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-beta.2/css/bootstrap.min.css"/>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>

    <!-- 🔥 FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/4.12.1/firebase.js"></script>
    <script src="https://www.gstatic.com/firebasejs/4.12.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/4.12.1/firebase-firestore.js"></script>
  </head>

  <body>
    <div class="container p-5">
      <div class="row">

        <!-- LOGIN -->
        <div class="col-8 offset-2" id="loginForm">
          <form>
            <div class="form-group row">
              <label class="col-4 col-form-label">Email:</label>
              <div class="col-8">
                <input type="email" class="form-control" id="loginEmail" />
              </div>
            </div>

            <div class="form-group row">
              <label class="col-4 col-form-label">Password:</label>
              <div class="col-8">
                <input type="password" class="form-control" id="loginPassword" />
              </div>
            </div>

            <div class="form-group row">
              <div class="offset-4 col-8">
                <button type="button" id="newUser" class="btn btn-outline-primary float-right">
                  Registrar
                </button>

                <button type="button" id="login" class="btn btn-default float-right mr-3">
                  Entrar
                </button>

                <!-- 🔥 GOOGLE -->
                <button type="button" id="googleLogin" class="btn btn-danger float-right mr-3">
                  Google
                </button>
              </div>
            </div>
          </form>
        </div>

        <!-- SIGNUP -->
        <div class="col-8 offset-2" id="signupForm" style="display:none">
          <input type="email" id="signupEmail" placeholder="Email" class="form-control mb-2"/>
          <input type="password" id="signupPassword" placeholder="Password" class="form-control mb-2"/>
          <input type="password" id="signupPasswordConfirm" placeholder="Confirmar" class="form-control mb-2"/>
          <button id="signup" class="btn btn-primary">Crear usuario</button>
        </div>

        <!-- ITEMS -->
        <div class="col-8 offset-2" id="itemsForm" style="display:none">
          <input type="text" id="title" placeholder="Título" class="form-control mb-2"/>
          <input type="text" id="content" placeholder="Contenido" class="form-control mb-2"/>
          <button id="save" class="btn btn-success">Guardar</button>
          <input type="hidden" id="elementId"/>
        </div>

        <div id="alert"></div>

      </div>

      <table id="listItems" class="table" style="display:none"></table>
    </div>

    <script src="js/config.js"></script>
    <script src="js/firestore.js"></script>
    <script src="js/items.js"></script>

    <script>
      function showAlert(text, type) {
        const el = document.getElementById("alert");
        el.innerText = text;
        el.className = "alert " + type;
        setTimeout(() => el.innerText = "", 2000);
      }

      // LOGIN EMAIL
      document.getElementById("login").onclick = async () => {
        const email = loginEmail.value;
        const password = loginPassword.value;

        try {
          const res = await auth.signInWithEmailAndPassword(email, password);
          await ensureUser(res.user);
          loginSuccess();
        } catch {
          showAlert("Error login", "alert-danger");
        }
      };

      // SIGNUP
      document.getElementById("signup").onclick = async () => {
        const email = signupEmail.value;
        const password = signupPassword.value;

        const res = await auth.createUserWithEmailAndPassword(email, password);
        await ensureUser(res.user);

        showAlert("Usuario creado", "alert-success");
        loginForm.style.display = "block";
        signupForm.style.display = "none";
      };

      // GOOGLE LOGIN
      document.getElementById("googleLogin").onclick = async () => {
        const provider = new firebase.auth.GoogleAuthProvider();

        try {
          const res = await auth.signInWithPopup(provider);
          await ensureUser(res.user);
          loginSuccess();
        } catch (e) {
          console.error(e);
        }
      };

      // 🔥 guardar usuario en firestore
      async function ensureUser(user) {
        const ref = db.collection("usuarios").doc(user.uid);
        const doc = await ref.get();

        if (!doc.exists) {
          await ref.set({
            uid: user.uid,
            email: user.email,
            nombre: user.displayName || "Usuario",
            createdAt: new Date()
          });
        }
      }

      function loginSuccess() {
        loginForm.style.display = "none";
        itemsForm.style.display = "block";
        listItems.style.display = "table";
        loadItems();
      }

      // MOSTRAR SIGNUP
      newUser.onclick = () => {
        loginForm.style.display = "none";
        signupForm.style.display = "block";
      };

      // GUARDAR ITEM (con usuario)
      save.onclick = async () => {
        const user = auth.currentUser;

        const doc = {
          title: title.value,
          content: content.value,
          id_usuario: user.uid
        };

        await addItem(doc);
      };
    </script>
  </body>
</html>
