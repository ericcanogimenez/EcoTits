<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>ECOTITS</title>

<script src="https://www.gstatic.com/firebasejs/4.12.1/firebase.js"></script>
<script src="https://www.gstatic.com/firebasejs/4.12.1/firebase-firestore.js"></script>

<style>
body{
    font-family: Arial;
    background:#10b981;
    color:white;
    text-align:center;
}

header{
    padding:30px;
}

.map{
    position:relative;
    max-width:800px;
    margin:auto;
}

.map img{
    width:100%;
}

.animal{
    position:absolute;
    font-size:30px;
    cursor:pointer;
}

.panda{top:45%;left:75%;}
.tigre{top:50%;left:68%;}
.elefante{top:60%;left:55%;}
.gorila{top:55%;left:50%;}
.lince{top:38%;left:45%;}

.card{
    display:none;
    background:white;
    color:black;
    padding:20px;
    margin:30px auto;
    max-width:600px;
    border-radius:10px;
}

.card img{
    width:100%;
    border-radius:10px;
}

button{
    padding:10px 20px;
    margin-top:10px;
    cursor:pointer;
}
</style>
</head>

<body>

<header>
<h1>🌿 ECOTITS</h1>
<p>Protege la vida silvestre</p>
</header>

<div>
<input id="user" placeholder="Email">
<button onclick="login()">Entrar</button>
<p id="welcome"></p>
</div>

<div class="map">
<img src="https://upload.wikimedia.org/wikipedia/commons/8/80/World_map_-_low_resolution.svg">

<span class="animal panda" onclick="show('panda')">🐼</span>
<span class="animal tigre" onclick="show('tigre')">🐯</span>
<span class="animal elefante" onclick="show('elefante')">🐘</span>
<span class="animal gorila" onclick="show('gorila')">🦍</span>
<span class="animal lince" onclick="show('lince')">🐱</span>
</div>


<div id="panda" class="card">
<h2>Panda Gigante</h2>
<img src="https://upload.wikimedia.org/wikipedia/commons/0/0f/Grosser_Panda.JPG">
<p>Firmas: <span id="pandaCount">0</span></p>
<button onclick="sign('panda')">Firmar petición</button>
</div>

<div id="tigre" class="card">
<h2>Tigre</h2>
<img src="https://upload.wikimedia.org/wikipedia/commons/5/56/Tiger.50.jpg">
<p>Firmas: <span id="tigreCount">0</span></p>
<button onclick="sign('tigre')">Firmar petición</button>
</div>

<div id="elefante" class="card">
<h2>Elefante</h2>
<img src="https://upload.wikimedia.org/wikipedia/commons/6/6e/Elephant_near_ndutu.jpg">
<p>Firmas: <span id="elefanteCount">0</span></p>
<button onclick="sign('elefante')">Firmar petición</button>
</div>

<div id="gorila" class="card">
<h2>Gorila</h2>
<img src="https://upload.wikimedia.org/wikipedia/commons/7/73/Silverback_Gorilla.jpg">
<p>Firmas: <span id="gorilaCount">0</span></p>
<button onclick="sign('gorila')">Firmar petición</button>
</div>

<div id="lince" class="card">
<h2>Lince</h2>
<img src="https://upload.wikimedia.org/wikipedia/commons/1/1d/Iberian_lynx2.jpg">
<p>Firmas: <span id="linceCount">0</span></p>
<button onclick="sign('lince')">Firmar petición</button>
</div>

<script>

var config = {
  apiKey: "AIzaSyBlzJUaylP4tOSnkmA6vV1ucjm9lC-eNbk",
  authDomain: "ecotits-9f3b9.firebaseapp.com",
  projectId: "ecotits-9f3b9",
  storageBucket: "ecotits-9f3b9.firebasestorage.app",
  messagingSenderId: "1000612840037",
  appId: "1:1000612840037:web:fb7536d621d10de5ea3c8c"
};

firebase.initializeApp(config);

const auth = firebase.auth();
const db = firebase.firestore();

let animals=["panda","tigre","elefante","gorila","lince"];

async function login(){
let email = document.getElementById("user").value;
let password = prompt("Contraseña");

try{
  const userCredential = await auth.signInWithEmailAndPassword(email,password);
  document.getElementById("welcome").innerText="Bienvenido "+userCredential.user.email;
}catch(error){
  alert("Error login");
}
}

function show(id){
animals.forEach(a=>{
document.getElementById(a).style.display="none";
});
document.getElementById(id).style.display="block";
}

async function sign(animal){

let user = auth.currentUser;

if(!user){
alert("Primero inicia sesión");
return;
}

try{

await db.collection("firmas").add({
_id: Date.now().toString(),
animal_id: animal,
nombre: user.email,
email: user.email,
fecha: new Date().toISOString().split("T")[0]
});

// actualizar contador
const snapshot = await db.collection("firmas")
.where("animal_id","==",animal)
.get();

document.getElementById(animal+"Count").innerText = snapshot.size;

}catch(error){
console.error(error);
alert("Error al firmar");
}

}

// 🔄 CARGAR FIRMAS
window.onload = async () => {
for(let animal of animals){
const snapshot = await db.collection("firmas")
.where("animal_id","==",animal)
.get();

document.getElementById(animal+"Count").innerText = snapshot.size;
}
}

</script>

</body>
</html>
